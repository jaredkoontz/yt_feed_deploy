# this is used as a proxy (or edge) to ensure requests are valid to not
# choke the server.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    server_tokens off;
    reset_timedout_connection on;

    client_header_timeout 5s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 5s;
    keepalive_requests 50;

    # feeds are multi-MB xml and compress ~10x. gzip_proxied any is needed or
    # nginx skips compression for requests that arrive with a Via header.
    # note: nginx downgrades the app's strong ETag to a weak one (W/"...")
    # when it compresses, so the app's If-None-Match handling must accept that.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/xml application/rss+xml application/atom+xml text/xml text/css application/javascript application/json;

    limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;
    limit_req_zone $binary_remote_addr zone=per_ip_req:10m rate=2r/s;
    # 429 instead of the default 503 so clients back off rather than treat it as an outage
    limit_conn_status 429;
    limit_req_status 429;

    upstream yt_feed_app {
        server yt_feed_app:8000;
        keepalive 8;
    }

    server {
        listen 80 default_server;
        server_name _;

        limit_conn per_ip_conn 8;
        limit_req zone=per_ip_req burst=20 nodelay;

        # inherited by every location below that doesn't set its own
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;

        location ~* (^|/)(\.env|wp-|wordpress|phpunit|vendor/phpunit|xmlrpc\.php|phpmyadmin|cgi-bin|\.git) {
            return 444;
        }

        location /dl/ {
            proxy_send_timeout 30s;
            proxy_read_timeout 900s;
            proxy_pass http://yt_feed_app;
        }

        location / {
            proxy_send_timeout 15s;
            # a cold rebuild of a large channel is ~200 sequential api calls and
            # can exceed 60s. stopgap until the app caches between rebuilds.
            proxy_read_timeout 180s;
            proxy_pass http://yt_feed_app;
        }
    }
}
